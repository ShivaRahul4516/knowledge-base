
name: Regenerate Knowledge Base Index

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "content/**"
      - "build_content_index.py"
      - ".github/workflows/regenerate-index.yml"

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Generate content index
        run: python build_content_index.py

      - name: Commit updated index
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-index.json
          if git diff --cached --quiet; then
            echo "Content index is already up to date."
          else
            git commit -m "Regenerate content index"
            git push
          fi
